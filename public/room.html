<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>void</title>
  <link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23090909'/><text x='16' y='24' font-size='20' text-anchor='middle' fill='%2339d353' font-family='monospace' font-weight='bold'>v</text></svg>">
  <link rel="stylesheet" href="/style.css">
  <style>
    .e2ee-badge { font-size: 0.72rem; padding: 2px 7px; border-radius: 10px; font-family: monospace; }
    .e2ee-pending { background: #333; color: #888; }
    .e2ee-secured { background: #1a2e1a; color: #5fc75f; cursor: help; }
    .e2ee-failed  { background: #2e1a1a; color: #c75f5f; }

    .name-gate {
      position: fixed; inset: 0;
      background: var(--bg, #090909);
      display: none; align-items: center; justify-content: center;
      z-index: 100;
    }
    .name-gate.visible { display: flex; }
    .name-gate-box {
      display: flex; flex-direction: column; align-items: center;
      gap: 1rem; width: min(320px, 90vw);
    }
    .name-gate-wordmark {
      font-size: 3rem; font-weight: 800; letter-spacing: -0.03em;
      color: #39d353; margin-bottom: 0.5rem;
    }
    .name-gate-label {
      color: #444; font-size: 0.75rem; letter-spacing: 0.1em;
      text-transform: uppercase; text-align: center;
    }
    .name-gate-label span { color: #39d353; }

    .fp-gate { position: fixed; inset: 0; background: var(--bg, #090909);
      display: none; align-items: center; justify-content: center; z-index: 101; }
    .fp-gate.visible { display: flex; }
    .fp-gate-box { display: flex; flex-direction: column; align-items: center;
      gap: 1.2rem; width: min(340px, 90vw); text-align: center; }
    .fp-value { font-family: monospace; font-size: 1rem; letter-spacing: 0.12em;
      color: #39d353; background: #111; padding: 10px 16px; border-radius: 6px;
      word-break: break-all; }
    .fp-hint { font-size: 0.75rem; color: #555; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="room">
    <header class="room-header">
      <div class="room-left">
        <a href="/" class="back-link" aria-label="go back to home">←</a>
        <span class="room-code" id="room-code"></span>
        <span class="you-name" id="you-name"></span>
        <span id="e2ee-badge" class="e2ee-badge e2ee-pending" title="Establishing secure channel...">
          <span id="e2ee-label">[...] securing...</span>
        </span>
      </div>
      <div class="room-right">
        <button class="sound-btn" id="sound-btn" title="toggle sound notifications">snd:on</button>
        <span class="timer" id="timer">--:--:--</span>
        <span class="status waiting" id="status">waiting...</span>
        <button class="copy-btn" id="copy-btn">copy link</button>
      </div>
    </header>

    <div class="messages" id="messages" role="log" aria-live="polite" aria-label="chat messages">
      <div class="empty-state" id="empty-state" style="display:none">
        <div class="empty-code" id="empty-code"></div>
        <p class="empty-hint">share this code with someone to begin</p>
<button class="btn btn-primary empty-copy-btn" id="empty-copy-btn">copy invite link →</button>
      </div>
    </div>

    <div class="typing-indicator" id="typing-indicator" aria-live="polite"></div>

    <div class="input-area">
      <span class="prompt">›</span>
      <input
        type="text"
        id="msg-input"
        placeholder="type a message..."
        maxlength="2000"
        autocomplete="off"
        spellcheck="false"
        autocorrect="off"
        autocapitalize="none"
        disabled
      />
      <span class="char-count" id="char-count"></span>
      <button id="send-btn" disabled>send</button>
    </div>
  </div>

  <!-- scroll-to-bottom button -->
  <button class="scroll-btn" id="scroll-btn" aria-label="scroll to latest messages">↓ <span id="scroll-count"></span></button>

  <!-- dead state overlay (replaces forced redirects) -->
  <div class="dead-state" id="dead-state">
    <p class="dead-msg" id="dead-msg"></p>
    <a href="/" class="btn btn-primary dead-home-btn">create new room →</a>
  </div>

  <div class="name-gate" id="name-gate" role="dialog" aria-modal="true" aria-label="enter your name">
    <div class="name-gate-box">
      <div class="name-gate-wordmark">void</div>
      <p class="name-gate-label">joining <span id="gate-room-code"></span></p>
      <input
        type="text"
        id="gate-name"
        placeholder="your name (optional)"
        maxlength="20"
        autocomplete="off"
        spellcheck="false"
        autocorrect="off"
        autocapitalize="none"
      />
      <button class="btn btn-primary" id="gate-btn">enter room →</button>
    </div>
  </div>

  <div class="fp-gate" id="fp-gate" role="dialog" aria-modal="true" aria-label="verify peer fingerprint">
    <div class="fp-gate-box">
      <div class="name-gate-wordmark">verify peer</div>
      <p class="name-gate-label">fingerprint</p>
      <div class="fp-value" id="fp-value"></div>
      <p class="fp-hint">
        Ask your peer to confirm this fingerprint matches theirs.<br>
        If they differ, someone may be intercepting your messages.
      </p>
      <button class="btn btn-primary" id="fp-match-btn">✓ fingerprints match</button>
      <button class="btn" id="fp-mismatch-btn" style="color:#c75f5f">✗ mismatch — abort</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/theme.js"></script>
  <script src="/crypto.js"></script>
  <script src="/room.js"></script>
</body>
</html>
